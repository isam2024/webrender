name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }} artifact
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # aarch64 is built only on tagged releases; while iterating x86_64-only
        # halves CI time and matches the host we're targeting (AlmaLinux 8 x86_64).
        include:
          - arch: x86_64
            runner: ubuntu-latest
          # - arch: aarch64
          #   runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build artifact
        working-directory: shotwright-engine
        env:
          # GitHub Actions buildx layer cache. First run after enabling
          # populates the cache; subsequent src/-only changes reuse the
          # heavy mozjs/SpiderMonkey layers and finish in ~5–10 min.
          SHOTWRIGHT_CI_CACHE: gha
        run: ARCH=${{ matrix.arch }} ./build/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: shotwright-${{ matrix.arch }}
          path: shotwright-engine/dist/*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
