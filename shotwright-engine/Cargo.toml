[package]
name = "shotwright-engine"
version = "0.1.0"
edition = "2021"
description = "Headless URL-to-PNG screenshot CLI built on Servo, designed for shared-hosting PHP deployments"
license = "MPL-2.0"

[[bin]]
name = "shotwright"
path = "src/main.rs"

[dependencies]
servo = "0.1"
dpi = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
url = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
